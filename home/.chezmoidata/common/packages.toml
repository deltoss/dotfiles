# Cross-platform packages, installed on BOTH Windows and Linux.
#
# Each OS's install-packages script ranges over its own array PLUS this common
# array (OS array first, common last). Only put entries here whose install
# command AND idempotency check are identical on both OSes.
# Use mise/cargo/cargo-binstall/npm/uv/dotnet types with an `id` and a `tool`
# (which-)check. Optional `args` are separate arguments, not shell code.
# Keep custom installs as `commands`; OS-specific managers stay in per-OS files.
# `update_commands` overrides the action in update.nu only. Without it, custom
# entries re-run `commands`. Set update_commands = [] to skip updates.
#
# The package MANAGERS (rust, node, …) have OS-specific installs, so they live in
# the per-OS files and run before this bucket, cargo/npm are available here.
# Order matters: cargo-binstall must precede any `cargo binstall` user.

# --- mise ---
[[packages.common]]
name = "cmake"
description = "Cross-platform build system generator. Needed to build native deps from source."
tool = "cmake"
tags = ["all"]
package_type = "mise"
id = "cmake@latest"

