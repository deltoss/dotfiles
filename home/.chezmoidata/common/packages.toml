[[packages.common]]
name = "BOSL2"
description = "Belfry OpenScad Library, v2.0. An OpenSCAD library of shapes, masks, and manipulators to make working with OpenSCAD easier"
tags = ["personal"]
package_type = "commands"
commands = [
  'nu $"($env.CHEZMOI_SOURCEDIR)/scripts/install-bosl2.nu"',
]
update_commands = [
  'let target = ("~/.local/share/OpenSCAD/libraries/BOSL2" | path expand)',
  'if ($target | path exists) { git -C $target pull --ff-only }',
]