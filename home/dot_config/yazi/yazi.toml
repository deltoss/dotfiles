[mgr]
show_hidden = true

[opener]
edit = [
  { run = "nu ~/.config/yazi/scripts/zellij-edit.nu %s", desc = "Zellij Edit" },
  { run = "$EDITOR %s", block = true, desc = "Editor", for = "unix" },
  { run = "%EDITOR% %s", block = true, desc = "Editor", for = "windows" },
  { run = '$SHELL', block = true, desc = "Terminal", for = "unix" },
  { run = 'nu.exe', block = true, desc = "Terminal", for = "windows" },
]
audacity = [
  { run = 'audacity %s', orphan = true, desc = "Audacity", for = "unix" },
]
audio_play = [
  { run = 'mpv --no-video %s', block = true, desc = "mpv", for = "unix" },
]
video_play = [
  { run = 'vlc %s', orphan = true, desc = "VLC", for = "unix" },
]
handbrake = [
  { run = 'ghb %s', orphan = true, desc = "HandBrake", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "video/*", use = [ "video_play", "handbrake", "reveal" ] },
	{ mime = "audio/*", use = [ "audio_play", "play", "audacity", "reveal" ] },
]
append_rules = [
	{ url = "*", use = [ "edit", "open", "reveal"] },
]
